<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Fashion Store{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f7f9;
            color: #222;
        }

        nav {
            background: #1f1f1f;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-left, .nav-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 15px;
            transition: 0.2s;
        }

        nav a:hover {
            color: #d4af37;
        }

        .brand {
            font-size: 22px;
            font-weight: bold;
            color: #d4af37;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 30px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.06);
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 24px;
            margin-bottom: 15px;
        }

        .btn {
            padding: 10px 18px;
            background: #222;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 8px;
            text-decoration: none;
            display: inline-block;
            transition: 0.2s;
        }

        .btn:hover {
            background: #000;
        }

        .btn-blue {
            background: #2563eb;
        }

        .btn-blue:hover {
            background: #1d4ed8;
        }

        .btn-red {
            background: #dc2626;
        }

        .btn-red:hover {
            background: #b91c1c;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background: white;
        }

        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #111827;
            color: white;
        }

        tr:hover {
            background: #f9fafb;
        }

        .alert {
            padding: 15px;
            margin: 15px 0;
            border-radius: 10px;
        }

        .alert-error {
            background: #fef2f2;
            color: #b91c1c;
        }

        .alert-success {
            background: #ecfdf5;
            color: #047857;
        }

        .form-group {
            margin: 16px 0;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
        }

        .card {
            border: 1px solid #e5e7eb;
            padding: 18px;
            margin: 10px;
            border-radius: 12px;
            display: inline-block;
            width: 280px;
            vertical-align: top;
            background: white;
            transition: 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.06);
        }

        .card h3 {
            margin-bottom: 10px;
            font-size: 20px;
        }

        .price {
            font-size: 22px;
            color: #111827;
            font-weight: bold;
            margin: 10px 0;
        }

        .stock {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .muted {
            color: #6b7280;
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-left">
            <a href="/" class="brand">Fashion Store</a>
            <a href="/catalog">Каталог</a>
            <a href="/cart">Корзина {% if session.cart %}({{ session.cart|length }}){% endif %}</a>
        </div>

        <div class="nav-right">
            {% if session.admin %}
                <a href="/admin/orders">Админ-панель</a>
                <a href="/admin/logout">Выход</a>
            {% else %}
                <a href="/admin">Админ</a>
            {% endif %}
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
